[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-osint-toolkit"
version = "0.1.0"
description = "Privacy-first public Telegram link normalization and offline export analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ainny1"}]
keywords = ["osint", "telegram", "security", "privacy", "digital-forensics"]

[project.scripts]
tg-osint = "telegram_osint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
